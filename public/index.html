<script>
// Firebase 설정
const firebaseConfig = {
apiKey: "AIzaSyALcM_DFFdupCLCd-oW0f0IBanjngX396I",
authDomain: "sinbulsan-5c1f9.firebaseapp.com",
projectId: "sinbulsan-5c1f9",
storageBucket: "sinbulsan-5c1f9.firebasestorage.app",
messagingSenderId: "316026496310",
appId: "1:316026496310:web:dd132c679d3f765fc9ff97",
measurementId: "G-S0BBB92D1X"
};

// Firebase 초기화
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const attendanceRef = db.collection('attendance').doc('counter');

let count = 0;
let MAX_CAPACITY = 300;
let hasJoined = false;
let isPendingJoin = false;
let isOnline = true;
const loadingScreen = document.querySelector('.loading');

// 오프라인 상태에서 임시로 액션을 저장할 큐 (배열)
let offlineActions = [];

// 로컬 스토리지에 큐를 저장/로드하기
function saveOfflineActions() {
  localStorage.setItem('offlineActions', JSON.stringify(offlineActions));
}

function loadOfflineActions() {
  const stored = localStorage.getItem('offlineActions');
  if (stored) {
    offlineActions = JSON.parse(stored);
  } else {
    offlineActions = [];
  }
}

// 페이지 로드 시 기존 오프라인 액션 불러오기
window.addEventListener('load', () => {
  loadOfflineActions();
});

// 오프라인 큐에 쌓인 작업들을 Firestore에 반영 (최종 상태만)
async function processOfflineActions() {
  if (!offlineActions.length) return;
  try {
    showLoading();
    // 마지막 액션만 반영 (중복 join/cancel 방지)
    const lastAction = offlineActions[offlineActions.length - 1];
    if (!lastAction) return;
    await firebase.firestore().runTransaction(async (transaction) => {
      const doc = await transaction.get(attendanceRef);
      let currentCount = doc.data().count || 0;
      let max = doc.data().maxCapacity || 300;
      if (lastAction.type === 'join') {
        if (currentCount < max) {
          transaction.update(attendanceRef, { count: currentCount + 1 });
          hasJoined = true;
          localStorage.setItem('hasJoined', 'true');
        } else {
          alert('정원이 초과되었습니다.');
        }
      } else if (lastAction.type === 'cancel') {
        if (currentCount > 0) {
          transaction.update(attendanceRef, { count: currentCount - 1 });
          hasJoined = false;
          localStorage.removeItem('hasJoined');
        }
      }
    });
    offlineActions = [];
    saveOfflineActions();
    updateDisplay();
  } catch (e) {
    console.error('오프라인 액션 처리 오류:', e);
    alert('오프라인 작업 처리 중 오류가 발생했습니다.');
  } finally {
    hideLoading();
  }
}

// 네트워크 상태 모니터링
function setupNetworkMonitoring() {
    window.addEventListener('online', () => {
        isOnline = true;
        updateDisplay();
    });

    window.addEventListener('offline', () => {
        isOnline = false;
        updateDisplay();
    });
}

// 이벤트 날짜/시간 유효성 검사
function isEventValid(eventDate, eventTime) {
    const now = new Date();
    const [year, month, day] = eventDate.split('-').map(Number);
    const [hours, minutes] = eventTime.split(':').map(Number);
    const eventDateTime = new Date(year, month - 1, day, hours, minutes);
    return eventDateTime > now;
}

function showLoading() {
    loadingScreen.classList.add('active');
}

function hideLoading() {
    loadingScreen.classList.remove('active');
}

// 날짜 포맷 함수
function formatDate(dateStr) {
    if (!dateStr) return '날짜 미정';
    const [year, month, day] = dateStr.split('-').map(Number);
    const date = new Date(year, month - 1, day);
    return date.toLocaleDateString('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'short'
    });
}

// 시간 포맷 함수
function formatTime(timeStr) {
    if (!timeStr) return '';
    const [hours, minutes] = timeStr.split(':');
    const hour = parseInt(hours);
    return `${hour < 12 ? '오전' : '오후'} ${String(hour % 12 || 12).padStart(2, '0')}:${minutes}`;
}

// 초기 데이터 로드 (상태 설정 제외)
async function loadInitialData() {
    try {
        showLoading();
        const doc = await attendanceRef.get();
        if (!doc.exists) {
            await attendanceRef.set({ 
                count: 0, 
                maxCapacity: 300,
                date: '2024-01-13',
                time: '14:00',
                mainTitle: '신불산 프로젝트',
                lastReset: firebase.firestore.FieldValue.serverTimestamp()
            });
            clearLocalState();
        } else {
            const data = doc.data();
            await syncWithServerState(data);
        }
    } catch (error) {
        console.error('데이터 로드 중 오류:', error);
        alert('데이터를 불러오는 중 오류가 발생했습니다.');
    } finally {
        hideLoading();
    }
}

// 로컬 상태 초기화 (불필요한 전체 삭제 X)
function clearLocalState() {
    hasJoined = false;
    localStorage.removeItem('hasJoined');
    localStorage.removeItem('lastReset');
    localStorage.removeItem('eventDate');
    localStorage.removeItem('eventTime');
    localStorage.removeItem('offlineActions');
}

// 서버 상태와 동기화
async function syncWithServerState(data) {
    // 초기화 시점 확인
    const lastReset = data.lastReset?.toDate();
    const localLastReset = localStorage.getItem('lastReset');
    const needsReset = !localLastReset || 
                      (lastReset && new Date(localLastReset) < lastReset);

    if (needsReset) {
        clearLocalState();
        if (lastReset) {
            localStorage.setItem('lastReset', lastReset.toISOString());
        }
    }

    // UI 업데이트
    document.getElementById('mainTitle').textContent = data.mainTitle || '신불산 프로젝트';
    const formattedDate = formatDate(data.date);
    const formattedTime = formatTime(data.time);
    document.getElementById('dateInfo').textContent = `${formattedDate} ${formattedTime}`;
    document.getElementById('capacityInfo').textContent = `최대 수용 인원: ${data.maxCapacity || 300}명`;
    
    // 상태 업데이트
    count = data.count || 0;
    MAX_CAPACITY = data.maxCapacity || 300;
    // hasJoined 복원: localStorage 값이 true면 true, 아니면 false
    hasJoined = !needsReset && localStorage.getItem('hasJoined') === 'true';

    // 날짜/시간 정보 저장
    if (data.date && data.time) {
        localStorage.setItem('eventDate', data.date);
        localStorage.setItem('eventTime', data.time);
        updateTimeLeft(data.date, data.time);
    }

    updateDisplay();
    updateParticipationStatus(count, MAX_CAPACITY);
}

// 남은 시간 계산 및 표시 함수
function updateTimeLeft(eventDate, eventTime) {
    const now = new Date();
    const [year, month, day] = eventDate.split('-').map(Number);
    const [eventHours, minutes] = eventTime.split(':').map(Number);
    const eventDateTime = new Date(year, month - 1, day, eventHours, minutes);
    const timeLeft = eventDateTime - now;

    if (timeLeft <= 0) {
        document.getElementById('eventTimeLeft').textContent = '행사가 종료되었습니다';
        return;
    }

    const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
    const remainingHours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const mins = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));

    // 남은 시간에 따른 텍스트 색상 변경
    const timeLeftElement = document.getElementById('eventTimeLeft');
    timeLeftElement.textContent = `행사까지 남은 시간: ${days}일 ${remainingHours}시간 ${mins}분`;
    
    // 24시간 이내일 때 강조
    if (days === 0 && remainingHours < 24) {
        timeLeftElement.style.color = '#e74c3c';
        timeLeftElement.style.fontWeight = 'bold';
    }
}

// 참가 현황 업데이트 함수
function updateParticipationStatus(count, maxCapacity) {
    const currentStatus = document.getElementById('currentStatus');
    const participationRate = document.getElementById('participationRate');
    const rate = Math.round((count / maxCapacity) * 100);

    currentStatus.textContent = `현재 참가 현황: ${count}명 참가 중`;
    participationRate.textContent = `참가율: ${rate}%`;

    // 참가율에 따른 색상 변경
    if (rate >= 90) {
        participationRate.style.color = '#e74c3c';  // 빨간색 (90% 이상)
    } else if (rate >= 70) {
        participationRate.style.color = '#f39c12';  // 주황색 (70% 이상)
    } else if (rate >= 50) {
        participationRate.style.color = '#2ecc71';  // 초록색 (50% 이상)
    }
}

// 공유하기 기능
async function shareEvent() {
    const shareData = {
        title: document.getElementById('mainTitle').textContent,
        text: '신불산 프로젝트에 참여하세요!',
        url: window.location.href
    };

    try {
        if (navigator.share) {
            await navigator.share(shareData);
        } else {
            // 클립보드에 링크 복사
            await navigator.clipboard.writeText(window.location.href);
            alert('링크가 클립보드에 복사되었습니다!');
        }
    } catch (error) {
        console.error('공유하기 실패:', error);
    }
}

// 실시간 업데이트 리스너 수정
attendanceRef.onSnapshot((doc) => {
    if (doc.exists) {
        const data = doc.data();
        syncWithServerState(data);
    }
}, (error) => {
    console.error("Snapshot error:", error);
    isOnline = false;
    updateDisplay();
});

// 참가하기
async function joinAttendance() {
  if (!isOnline) {
    offlineActions.push({ type: 'join', timestamp: Date.now() });
    saveOfflineActions();
    hasJoined = true;
    isPendingJoin = false;
    localStorage.setItem('hasJoined', 'true');
    updateDisplay();
    return;
  }
  if (!hasJoined && count < MAX_CAPACITY) {
    hasJoined = true;
    isPendingJoin = false;
    updateDisplay(); // 즉시 UI 반영
    try {
      showLoading();
      await firebase.firestore().runTransaction(async (transaction) => {
        const doc = await transaction.get(attendanceRef);
        let currentCount = doc.data().count || 0;
        let max = doc.data().maxCapacity || 300;
        if (currentCount < max) {
          transaction.update(attendanceRef, { count: currentCount + 1 });
          localStorage.setItem('hasJoined', 'true');
        } else {
          alert('정원이 초과되었습니다.');
        }
      });
    } catch (error) {
      hasJoined = false;
      updateDisplay();
      console.error('참가 신청 중 오류:', error);
      alert('참가 신청 중 오류가 발생했습니다.');
    } finally {
      hideLoading();
    }
  }
}

// 참가 취소하기
async function cancelAttendance() {
  if (!isOnline) {
    offlineActions.push({ type: 'cancel', timestamp: Date.now() });
    saveOfflineActions();
    hasJoined = false;
    isPendingJoin = false;
    localStorage.removeItem('hasJoined');
    updateDisplay();
    return;
  }
  if (hasJoined) {
    try {
      showLoading();
      await firebase.firestore().runTransaction(async (transaction) => {
        const doc = await transaction.get(attendanceRef);
        let currentCount = doc.data().count || 0;
        if (currentCount > 0) {
          transaction.update(attendanceRef, { count: currentCount - 1 });
          hasJoined = false;
          isPendingJoin = false;
          localStorage.removeItem('hasJoined');
        }
      });
      updateDisplay();
    } catch (error) {
      console.error('참가 취소 중 오류:', error);
      alert('참가 취소 중 오류가 발생했습니다.');
    } finally {
      hideLoading();
    }
  }
}

function updateDisplay() {
    const counter = document.getElementById('counter');
    const buttonGroup = document.getElementById('buttonGroup');
    const statusMessage = document.getElementById('statusMessage');
    const myStatus = document.getElementById('myStatus');
    const capacityInfo = document.getElementById('capacityInfo');

    counter.innerText = count;
    counter.classList.add('update');
    setTimeout(() => counter.classList.remove('update'), 300);

    capacityInfo.textContent = `최대 수용 인원: ${MAX_CAPACITY}명`;

    // 버튼 그룹 동적 렌더링
    buttonGroup.innerHTML = '';
    const buttonsDisabled = !isOnline;
    if (!hasJoined && !isPendingJoin) {
        // 참가 전: 참가 버튼만
        const joinBtn = document.createElement('button');
        joinBtn.className = 'join-btn';
        joinBtn.id = 'joinBtn';
        joinBtn.textContent = count >= MAX_CAPACITY ? '정원 초과' : '참가';
        joinBtn.disabled = buttonsDisabled || count >= MAX_CAPACITY;
        joinBtn.onclick = showPendingJoinUI;
        buttonGroup.appendChild(joinBtn);
    } else if (isPendingJoin) {
        // 참가 대기: 취소 + 신청 완료 버튼
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'cancel-btn';
        cancelBtn.id = 'cancelBtn';
        cancelBtn.textContent = '취소';
        cancelBtn.disabled = buttonsDisabled;
        cancelBtn.onclick = cancelPendingJoin;
        buttonGroup.appendChild(cancelBtn);

        const doneBtn = document.createElement('button');
        doneBtn.className = 'join-btn';
        doneBtn.textContent = '신청 완료';
        doneBtn.disabled = buttonsDisabled;
        doneBtn.style.backgroundColor = '#2ecc71';
        doneBtn.onclick = joinAttendance;
        buttonGroup.appendChild(doneBtn);
    } else if (hasJoined) {
        // 참가 완료: 취소 + 신청 완료(비활성)
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'cancel-btn';
        cancelBtn.id = 'cancelBtn';
        cancelBtn.textContent = '취소';
        cancelBtn.disabled = buttonsDisabled;
        cancelBtn.onclick = cancelAttendance;
        buttonGroup.appendChild(cancelBtn);

        const doneBtn = document.createElement('button');
        doneBtn.className = 'join-btn';
        doneBtn.textContent = '신청 완료';
        doneBtn.disabled = true;
        doneBtn.style.backgroundColor = '#2ecc71';
        buttonGroup.appendChild(doneBtn);
    }

    if (!isOnline) {
        statusMessage.textContent = '네트워크 연결 끊김';
        statusMessage.style.color = '#e74c3c';
    } else if (count >= MAX_CAPACITY) {
        statusMessage.textContent = '정원이 마감되었습니다';
        statusMessage.style.color = '#e74c3c';
    } else if (count === 0) {
        statusMessage.textContent = '참가자를 기다리고 있습니다';
        statusMessage.style.color = '#666';
    } else {
        statusMessage.textContent = `남은 자리: ${MAX_CAPACITY - count}명`;
        statusMessage.style.color = '#2ecc71';
    }

    // 참가 상태 표시
    if (isPendingJoin) {
        myStatus.textContent = '신청 대기 중';
        myStatus.style.color = '#f39c12';
    } else {
        myStatus.textContent = hasJoined ? '✅ 참가 신청 완료' : '미참가 상태';
        myStatus.style.color = hasJoined ? '#2ecc71' : '#666';
    }
}

function showPendingJoinUI() {
    isPendingJoin = true;
    updateDisplay();
}

function cancelPendingJoin() {
    isPendingJoin = false;
    updateDisplay();
}

// 내 상태 초기화 함수
async function resetMyStatus() {
    if (!isOnline) {
        alert('네트워크 연결을 확인해주세요.');
        return;
    }

    try {
        showLoading();
        
        // 참가 상태였다면 카운트 감소
        if (hasJoined) {
            await attendanceRef.update({
                count: firebase.firestore.FieldValue.increment(-1)
            });
        }
        // 로컬 상태 초기화
        hasJoined = false;
        localStorage.removeItem('hasJoined');
        localStorage.removeItem('lastReset');
        localStorage.removeItem('eventDate');
        localStorage.removeItem('eventTime');
        localStorage.removeItem('offlineActions');
        updateDisplay();
        alert('내 참가 상태가 초기화되었습니다.');
    } catch (error) {
        console.error('상태 초기화 중 오류:', error);
        alert('상태 초기화 중 오류가 발생했습니다.');
    } finally {
        hideLoading();
    }
}

// 네트워크가 다시 연결되었을 때, 오프라인 액션 처리
window.addEventListener('online', async () => {
  isOnline = true;
  try {
    const doc = await attendanceRef.get();
    if (doc.exists) {
      await syncWithServerState(doc.data());
    }
  } catch (error) {
    console.error('상태 재검증 중 오류:', error);
  }
  await processOfflineActions();
});

// 페이지 로드 시 초기화
loadInitialData();
setupNetworkMonitoring();

// 1분마다 남은 시간 업데이트
setInterval(() => {
    const savedDate = localStorage.getItem('eventDate');
    const savedTime = localStorage.getItem('eventTime');
    
    if (savedDate && savedTime) {
        updateTimeLeft(savedDate, savedTime);
    }
}, 60000);
</script>
